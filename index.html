<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Save important links, organize them with collections and tags, and find anything instantly with LinkVault."
    />
    <meta name="theme-color" content="#0a0a0a" />
    <title>LinkVault — Save, Organize &amp; Find Links</title>
    <script>
      const savedTheme = localStorage.getItem("linkvault-theme");
      const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.dataset.theme = savedTheme ?? (prefersDark ? "dark" : "light");
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
